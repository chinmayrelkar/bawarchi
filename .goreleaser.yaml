# goreleaser configuration for bawarchi.
# Docs: https://goreleaser.com  —  validate with `goreleaser check`.
version: 2

project_name: bawarchi

before:
  hooks:
    - go mod tidy

builds:
  - id: bawarchi
    main: ./cmd/bawarchi
    binary: bawarchi
    env:
      - CGO_ENABLED=0
    # Stamp the version that `bawarchi --version` reports (var: main.version).
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
