name: Auto Release

# Runs after CI succeeds on main and cuts a release automatically: bumps a
# semver tag (feat: -> minor, everything else -> patch, BREAKING CHANGE ->
# major) and runs GoReleaser against it in the same job.
#
# Tagging and releasing happen in one workflow, not two, because a tag
# pushed with the default GITHUB_TOKEN does not trigger other workflows
# (GitHub's loop-prevention) -- a separate tag-triggered workflow would
# never fire. release.yml is kept as a manual fallback for hand-pushed tags.
#
# The tag bump is a small inline script rather than a third-party action:
# mathieudutour/github-tag-action force-moved the v0.1.0 tag onto a new
# commit instead of creating v0.1.1 when only one prior tag existed, which
# broke GoReleaser (it computed the tag's expected commit before the move,
# then found the moved tag pointing elsewhere). This script never rewrites
# an existing tag -- it fails loudly instead.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute and push next tag
        id: tag_version
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
            range="HEAD"
          else
            range="${latest}..HEAD"
          fi

          bump=patch
          if git log "$range" --pretty=%B | grep -Eiq '^BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
            bump=major
          elif git log "$range" --pretty=%B | grep -Eiq '^feat(\(.+\))?:'; then
            bump=minor
          fi

          ver="${latest#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_tag="v${major}.${minor}.${patch}"

          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "::error::tag $new_tag already exists; refusing to move it"
            exit 1
          fi

          echo "bumping $latest -> $new_tag ($bump)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$new_tag" -m "$new_tag"
          git push origin "$new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
