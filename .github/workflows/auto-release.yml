name: Auto Release

# Runs after CI succeeds on main and cuts a release automatically: bumps a
# semver tag (feat: -> minor, everything else -> patch, BREAKING CHANGE ->
# major) and runs GoReleaser against it in the same job.
#
# Tagging and releasing happen in one workflow, not two, because a tag
# pushed with the default GITHUB_TOKEN does not trigger other workflows
# (GitHub's loop-prevention) -- a separate tag-triggered workflow would
# never fire. release.yml is kept as a manual fallback for hand-pushed tags.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
